<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>兒科門診衛教室</title>
  <meta name="description" content="給家長的兒科常見問題衛教：用圖片與簡短文字說明成因、照顧方式與回診時機，並附醫師可查詢的用藥參考。">
  <meta property="og:type" content="website">
  <meta property="og:title" content="兒科門診衛教室">
  <meta property="og:description" content="給家長看得懂的兒科衛教，也給醫師快速查詢的用藥參考。">
  <meta property="og:url" content="https://cabbage765.github.io/peds-clinic-guide/">
  <meta property="og:image" content="https://cabbage765.github.io/peds-clinic-guide/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="zh_TW">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=3">
  <link rel="stylesheet" href="css/style.css?v=23">
</head>
<body data-page="home">
  <header id="site-header"></header>

  <section class="hero-band">
    <div class="wrap hero">
      <div>
        <h1>孩子生病了，<span class="nowrap">先別慌</span></h1>
        <p>這裡整理兒科門診最常見的問題，用圖片和簡短的文字說明：為什麼會生病、在家怎麼照顧、什麼情況要回診。點下面的主題就能看。</p>
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="7"/><path d="m16 16 5 5"/></svg>
          <input id="q" type="search" placeholder="搜尋症狀或疾病，例如：耳朵痛、發燒、咳嗽" aria-label="搜尋衛教主題">
        </div>
      </div>
      <div class="hero-art">
        <img src="img/hero.webp" alt="兒科醫師和三個笑咪咪的孩子，周圍有體溫計、疫苗、肺、胃、藥丸與健康檢查表的圖示" width="1536" height="1024">
      </div>
    </div>
  </section>

  <main class="wrap">
    <div id="categories"></div>
    <p id="empty" class="empty">找不到相關主題，換個關鍵字試試看，或直接詢問門診醫師。</p>

    <section id="adult-zone" class="cat adult-zone" data-cat>
      <div class="cat-head"><div class="dot" style="background:#eef1f6">🧑</div><h2>成人專區</h2></div>
      <p class="small muted" style="margin:-4px 0 12px">給爸爸媽媽、準媽媽與家中長輩的衛教資料。</p>
      <div class="topics" id="adult-topics"></div>
    </section>

    <section id="doc-index" class="doc-index">
      <h2>醫師專區</h2>
      <p class="small muted">各主題頁面最下方附有致病原、建議用藥、劑量與療程的整理，方便門診時查詢。</p>
      <ul id="doc-list"></ul>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <script src="js/common.js?v=23"></script>
</body>
</html>
